[project]
name = "price-parser-demo"
version = "0.1.0"
description = "Парсер каталога с выгрузкой в Excel / Google Таблицу и уведомлениями в Telegram"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
